ul.clean{margin:6px 0;padding-left:18px}ul.clean li{margin:4px 0}

@media (prefers-reduced-motion:no-preference){.view-in{animation:vin .25s ease-out}@keyframes vin{from{opacity:.4}to{opacity:1}}}
</style></head><body>
<div class="app">
 <aside class="side"><div class="brand">Demand Prediction &amp; Replenishment Support<small>Forecast, then decide</small></div>
  <nav class="nav" id="nav" aria-label="Views"></nav>
  <div class="side-foot">Forecasting unit: product × location × week. Target: next-week demand. Prototype for a machine learning course project.</div></aside>
 <main class="main"><header class="top"><div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div>
  <div class="badges" id="badges"></div><button class="iconbtn" id="theme" aria-label="Toggle light or dark theme">Theme</button></header>
  <div id="view"></div></main></div>
<div class="tip" id="tip"></div><div class="toast" id="toast" role="status"></div>
<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title" style="margin-top:0"></h2><p class="mut">Select the text and copy it into a file.</p><textarea id="modal-text" readonly></textarea><div style="margin-top:10px;text-align:right"><button class="btn" data-act="closemodal">Close</button></div></div></div>
<script>
/* ====================== CORE: data, model, replenishment ====================== */
const MS_DAY = 86400000;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function randn(r){let u=0,v;while(u===0)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function isoWeekLabel(d){const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const ys=new Date(Date.UTC(y,0,1));const w=Math.ceil(((t-ys)/MS_DAY+1)/7);return y+'-W'+String(w).padStart(2,'0')}
function isoWeekNum(d){return parseInt(isoWeekLabel(d).split('-W')[1],10)}
/* Approximate Ramadan windows (moon-sighting dependent) used only as an optional calendar feature. */
const RAMADAN=[[Date.UTC(2024,2,11),Date.UTC(2024,3,9)],[Date.UTC(2025,2,1),Date.UTC(2025,2,30)],[Date.UTC(2026,1,18),Date.UTC(2026,2,19)],[Date.UTC(2027,1,8),Date.UTC(2027,2,8)]];
function ramadanFlag(d){if(!d)return 0;const s=d.getTime(),e=s+6*MS_DAY;return RAMADAN.some(([a,b])=>s<=b&&e>=a)?1:0}

const PRODUCTS=[
 {id:'P001',name:'Cooking oil 5 L',cat:'Edible oils',sup:'S01',base:520,price:2800,amp:.06,ram:.25,promo:.30,lt:5,moq:100},
 {id:'P002',name:'Basmati rice 5 kg',cat:'Staples',sup:'S02',base:410,price:2300,amp:.05,ram:.20,promo:.25,lt:7,moq:100},
 {id:'P003',name:'Black tea 950 g',cat:'Beverages',sup:'S03',base:380,price:1900,amp:.08,ram:.30,promo:.20,lt:6,moq:50},
 {id:'P004',name:'Sugar 5 kg',cat:'Staples',sup:'S02',base:600,price:800,amp:.04,ram:.35,promo:.15,lt:4,moq:200},
 {id:'P005',name:'Wheat flour 10 kg',cat:'Staples',sup:'S04',base:700,price:1500,amp:.03,ram:.15,promo:.10,lt:3,moq:200},
 {id:'P006',name:'Soft drink 1.5 L',cat:'Beverages',sup:'S05',base:640,price:200,amp:.35,ram:.10,promo:.30,lt:4,moq:120},
 {id:'P007',name:'Fruit juice 1 L',cat:'Beverages',sup:'S05',base:360,price:280,amp:.30,ram:.25,promo:.25,lt:5,moq:60},
 {id:'P008',name:'Cream biscuits',cat:'Snacks',sup:'S06',base:450,price:60,amp:.05,ram:.05,promo:.35,lt:5,moq:100},
 {id:'P009',name:'UHT milk 1 L',cat:'Dairy',sup:'S07',base:560,price:330,amp:.06,ram:.15,promo:.15,lt:3,moq:120},
 {id:'P010',name:'Red chili powder 200 g',cat:'Spices',sup:'S08',base:180,price:450,amp:.05,ram:.10,promo:.15,lt:7,moq:40},
 {id:'P011',name:'Lentils 1 kg',cat:'Staples',sup:'S04',base:330,price:420,amp:.04,ram:.20,promo:.10,lt:6,moq:60},
 {id:'P012',name:'Instant noodles pack',cat:'Snacks',sup:'S06',base:290,price:400,amp:.08,ram:.00,promo:.30,lt:7,moq:50}];
const LOCATIONS=[{id:'MUL-01',scale:1.0},{id:'MUL-02',scale:.7},{id:'LHR-01',scale:1.4},{id:'LHR-02',scale:1.1}];
const N_WEEKS=104;
const START_DATE=Date.UTC(2024,8,30); // Monday

function generateSyntheticData(seed){
  const r=mulberry32(seed||20260928);const series=[];
  for(const p of PRODUCTS){for(const loc of LOCATIONS){
    const base=p.base*loc.scale*(.85+.3*r());const growth=(r()-.35)*.14;
    const zs=.6+r()*1.5, mult=r()<.14?2.4+r()*1.6:(r()<.4?.7+r()*.25:1.15+r()*.6);
    const rows=[];let inv=base*(1.2+r()),pipe=[];
    for(let w=0;w<N_WEEKS;w++){
      const date=new Date(START_DATE+w*7*MS_DAY);
      const woy=isoWeekNum(date);
      const promo=r()<.12?1:0;
      const price=Math.round(p.price*(1+.0007*w)*(promo?.9:1)/5)*5||1;
      const ram=ramadanFlag(date);
      const season=1+p.amp*Math.sin(2*Math.PI*(woy-12)/52);
      let d=base*(1+growth*w/N_WEEKS)*season*(ram?1+p.ram:1)*(promo?1+p.promo:1)*Math.exp(.10*randn(r));
      d=Math.max(0,Math.round(d));
      const arrive=pipe.filter(o=>o.at<=w).reduce((a,o)=>a+o.q,0);pipe=pipe.filter(o=>o.at>w);
      const avail=inv+arrive;const sales=Math.min(d,Math.round(avail));const closing=Math.round(avail-sales);
      const unmet=d-sales;const so=unmet>0?1:0;const backorder=Math.round(unmet*.25);
      const lt=Math.max(1,Math.round(p.lt+.8*randn(r)));
      const incPre=Math.round(pipe.reduce((a,o)=>a+o.q,0));
      inv=closing;
      const row={w,date,week:isoWeekLabel(date),sales,closing,incoming:incPre,backorder,so,price,promo,lt,ram};
      rows.push(row);
      {
        const h=rows.slice(-4).map(x=>x.sales);const m4=mean(h);
        const h8=rows.slice(-8).map(x=>x.sales);const m8=mean(h8);
        const sd=std(h8);
        const Lw=lt/7;const ip=closing+incPre-backorder;
        const rop=m4*(Lw+.6)+zs*sd*Math.sqrt(Lw);
        if(ip<=rop){
          const tgt=(m4*1.2+zs*sd)*mult;let q=Math.max(0,Math.round(tgt-ip));
          if(q>0){q=Math.max(q,p.moq);const delay=r()<.07?1:0;pipe.push({at:w+1+Math.ceil(Math.max(0,lt-7)/7)+delay,q});row.incoming=incPre+q;}
        }
      }
    }
    series.push({key:p.id+'|'+loc.id,pid:p.id,loc:loc.id,name:p.name,cat:p.cat,sup:p.sup,moq:p.moq,rows});
  }}
  return series;
}

/* ---------- stats helpers ---------- */
const sum=a=>a.reduce((x,y)=>x+y,0);
const mean=a=>a.length?sum(a)/a.length:0;
const std=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(sum(a.map(x=>(x-m)**2))/a.length)};

/* ---------- features (all computed from information available at forecast origin t) ---------- */
const FEATURE_NAMES=['Intercept','Lag_1','Lag_2','Lag_4','Lag_8','Lag_12','Rolling_Mean_4','Rolling_Mean_8','Rolling_STD_8','Sales_Trend_4','Inventory_Coverage','Stockout_Flag (origin week)','Price_Change','Promotion (planned, target week)','Ramadan (target week)','Season_sin','Season_cos'];
const MIN_ORIGIN=11;
function features(rows,t,plan){
  const s=i=>rows[i].sales;
  const win=k=>{const a=[];for(let i=t-k+1;i<=t;i++)a.push(s(i));return a};
  const m4=mean(win(4)),m8=mean(win(8)),m12=mean(win(12));
  const sc=Math.max(1,m12);
  const tgt=rows[t+1]||plan;           // target week info (planned promo / calendar are known in advance)
  const tdate=tgt.date;
  const woy=tdate?isoWeekNum(tdate):1;
  const cov=Math.min(6,rows[t].closing/Math.max(1,m4));
  const pc=rows[t-1]?rows[t].price/Math.max(1,rows[t-1].price)-1:0;
  return {x:[1,s(t)/sc,s(t-1)/sc,s(t-3)/sc,s(t-7)/sc,s(t-11)/sc,m4/sc,m8/sc,std(win(8))/sc,(m4-m12)/sc,cov,rows[t].so,pc,tgt.promo||0,tgt.ram||0,Math.sin(2*Math.PI*woy/52),Math.cos(2*Math.PI*woy/52)],sc,m4};
}
function solveRidge(X,y,lambda){
  const p=X[0].length;const A=Array.from({length:p},()=>new Array(p+1).fill(0));
  for(let n=0;n<X.length;n++){const x=X[n];for(let i=0;i<p;i++){for(let j=0;j<p;j++)A[i][j]+=x[i]*x[j];A[i][p]+=x[i]*y[n]}}
  for(let i=1;i<p;i++)A[i][i]+=lambda*X.length;
  for(let c=0;c<p;c++){let piv=c;for(let r2=c+1;r2<p;r2++)if(Math.abs(A[r2][c])>Math.abs(A[piv][c]))piv=r2;[A[c],A[piv]]=[A[piv],A[c]];
    const d=A[c][c]||1e-9;for(let j=c;j<=p;j++)A[c][j]/=d;
    for(let r2=0;r2<p;r2++){if(r2===c)continue;const f=A[r2][c];if(f)for(let j=c;j<=p;j++)A[r2][j]-=f*A[c][j]}}
  return A.map(row=>row[p]);
}
const dot=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s};

function splitBounds(n){return {tr:Math.floor(n*.70),va:Math.floor(n*.85)}}   // target-week index boundaries
function metrics(pairs){ // pairs of [forecast, actual]
  if(!pairs.length)return null;
  const e=pairs.map(([f,a])=>f-a);const A=sum(pairs.map(p=>p[1]));
  return {n:pairs.length,mae:mean(e.map(Math.abs)),rmse:Math.sqrt(mean(e.map(x=>x*x))),wape:A?sum(e.map(Math.abs))/A:NaN,bias:mean(e),biasPct:A?sum(e)/A:NaN};
}
function sampleSet(series,lo,hi,excludeCensored){ // origins whose target index in [lo,hi)
  const out=[];
  for(const s of series){const n=s.rows.length;
    for(let tg=Math.max(lo,MIN_ORIGIN+1);tg<Math.min(hi,n);tg++){
      if(excludeCensored&&s.rows[tg].so)continue;
      out.push({s,t:tg-1});}}
  return out;
}
function trainModel(series,opts){
  const n=Math.min(...series.map(s=>s.rows.length));const {tr,va}=splitBounds(n);
  const mk=(lo,hi,excl)=>{const smp=sampleSet(series,lo,hi,excl);return {X:smp.map(o=>features(o.s.rows,o.t).x),y:smp.map(o=>{const f=features(o.s.rows,o.t);return o.s.rows[o.t+1].sales/f.sc}),smp}};
  const train=mk(0,tr,opts.excludeCensored);
  const val=mk(tr,va,true);
  let best=null;const grid=[.0005,.002,.01,.05,.2];const tuning=[];
  for(const lam of grid){
    const b=solveRidge(train.X,train.y,lam);
    const pairs=val.smp.map((o,i)=>{const f=features(o.s.rows,o.t);return [Math.max(0,dot(b,f.x))*f.sc,o.s.rows[o.t+1].sales]});
    const m=metrics(pairs);tuning.push({lam,mae:m.mae});
    if(!best||m.mae<best.mae)best={lam,mae:m.mae,b};
  }
  // refit on all labelled rows (train+val+test) with chosen lambda for live next-week forecasts
  const all=mk(0,n,opts.excludeCensored);
  const bFinal=solveRidge(all.X,all.y,best.lam);
  return {beta:best.b,betaFinal:bFinal,lambda:best.lam,tuning,bounds:{tr,va,n},nTrain:train.X.length,nVal:val.X.length};
}
function evaluateAll(series,model){
  const {tr,va,n}=model.bounds;const test=sampleSet(series,va,n,true);
  const row=(fn)=>metrics(test.map(o=>[fn(o),o.s.rows[o.t+1].sales]));
  return {
    n:test.length,
    naive:row(o=>o.s.rows[o.t].sales),
    ma4:row(o=>features(o.s.rows,o.t).m4),
    ridge:row(o=>{const f=features(o.s.rows,o.t);return Math.max(0,dot(model.beta,f.x))*f.sc})
  };
}
function oneStepPredictions(s,model){ // for chart: prediction for every target idx >= 12 using the train/val-fitted model
  const out=new Array(s.rows.length).fill(null);
  for(let tg=MIN_ORIGIN+1;tg<s.rows.length;tg++){const f=features(s.rows,tg-1);out[tg]=Math.max(0,dot(model.beta,f.x))*f.sc}
  return out;
}
function seriesMetricsTest(s,model){
  const {va,n}=model.bounds;const pairs=[];const np=[],mp=[];
  for(let tg=Math.max(va,MIN_ORIGIN+1);tg<s.rows.length;tg++){if(s.rows[tg].so)continue;const f=features(s.rows,tg-1);
    pairs.push([Math.max(0,dot(model.beta,f.x))*f.sc,s.rows[tg].sales]);np.push([s.rows[tg-1].sales,s.rows[tg].sales]);mp.push([f.m4,s.rows[tg].sales])}
  return {ridge:metrics(pairs),naive:metrics(np),ma4:metrics(mp)};
}
function nextWeekDate(s){const last=s.rows[s.rows.length-1].date;return last?new Date(last.getTime()+7*MS_DAY):null}
function baselineForecast(s,model,promoNext){
  const rows=s.rows,t=rows.length-1;const nd=nextWeekDate(s);
  const plan={date:nd,promo:promoNext?1:0,ram:ramadanFlag(nd)};
  const f=features(rows,t,plan);
  return Math.max(0,dot(model.betaFinal,f.x))*f.sc;
}

/* ---------- replenishment layer (follows the PDF: forecast -> inventory position -> safety stock -> ROP -> order) ---------- */
const Z_TABLE={'90':1.2816,'95':1.6449,'97.5':1.96,'99':2.3263};
const DEFAULT_POLICY={service:'95',urgentPct:50,overstockMult:2,excludeCensored:true};
function replenish(s,forecastBase,policy,ov){
  ov=ov||{};const last=s.rows[s.rows.length-1];
  const adj=ov.adj||0;const F=Math.max(0,forecastBase*(1+adj/100));
  const L=ov.lt!=null?ov.lt:last.lt;const Lw=L/7;
  const z=Z_TABLE[policy.service];
  const sigma=std(s.rows.slice(-12).map(r=>r.sales));
  const SS=z*sigma*Math.sqrt(Lw);
  const LTD=F*Lw;const ROP=LTD+SS;
  const IP=last.closing+last.incoming-last.backorder;
  const target=F+SS;
  const moq=ov.moq!=null?ov.moq:s.moq;const cap=ov.cap||0;
  const dailyF=F/7;const coverDays=dailyF>0?last.closing/dailyF:Infinity;
  let status='Healthy';
  if(IP<=ROP)status=(IP<ROP*policy.urgentPct/100)?'Urgent':'Reorder';
  else if(IP>target*policy.overstockMult)status='Overstock Risk';
  let raw=IP<=ROP?Math.max(0,target-IP):0;
  let qty=raw,notes=[];
  if(raw>0&&qty<moq){qty=moq;notes.push('Raised to MOQ')}
  if(cap>0&&raw>0&&IP+qty>cap){const room=Math.max(0,cap-IP);qty=room;notes.push(room>0?'Limited by storage capacity':'No storage room')}
  qty=Math.round(qty);
  return {key:s.key,F,Fbase:forecastBase,adj,L,Lw,z,sigma,SS,LTD,ROP,IP,target,raw,qty,moq,cap,notes,status,coverDays,
          stock:last.closing,incoming:last.incoming,backorder:last.backorder,lastSales:last.sales,m4:mean(s.rows.slice(-4).map(r=>r.sales))};
}
/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
}
const normKey=k=>k.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
function seriesFromCSV(text){
  const t=parseCSV(text);if(t.length<2)throw new Error('The file has no data rows.');
  const hdr=t[0].map(normKey);const idx=n=>hdr.indexOf(normKey(n));
  const req=['Week','Product_ID','Location_ID','Sales_Qty','Closing_Inventory'];
  const miss=req.filter(c=>idx(c)<0);if(miss.length)throw new Error('Missing required column(s): '+miss.join(', ')+'.');
  const g=(r,c,d)=>{const i=idx(c);return i<0||r[i]===undefined||r[i].trim()===''?d:r[i].trim()};
  const num=(v,d)=>{const x=parseFloat(v);return isNaN(x)?d:x};
  const groups=new Map();const notes=new Set();
  for(let i=1;i<t.length;i++){const r=t[i];
    const pid=g(r,'Product_ID'),loc=g(r,'Location_ID');if(!pid||!loc)continue;
    const k=pid+'|'+loc;if(!groups.has(k))groups.set(k,{pid,loc,name:g(r,'Product_Name',pid),cat:g(r,'Product_Category','Uncategorised'),sup:g(r,'Supplier_ID','—'),rows:[]});
    const wk=g(r,'Week');let date=null;const m=wk.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m)date=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
    const closing=num(g(r,'Closing_Inventory'),0);
    const soRaw=g(r,'Stockout_Flag',null);
    if(soRaw===null)notes.add('Stockout_Flag not provided: derived as Closing_Inventory = 0 (approximation).');
    if(idx('Lead_Time_Days')<0)notes.add('Lead_Time_Days not provided: defaulted to 5 days.');
    if(idx('Incoming_Inventory')<0)notes.add('Incoming_Inventory not provided: defaulted to 0.');
    if(idx('Backorder_Qty')<0)notes.add('Backorder_Qty not provided: defaulted to 0.');
    groups.get(k).rows.push({wk,date,sales:num(g(r,'Sales_Qty'),0),closing,incoming:num(g(r,'Incoming_Inventory'),0),backorder:num(g(r,'Backorder_Qty'),0),
      so:soRaw===null?(closing===0?1:0):(parseFloat(soRaw)>0?1:0),price:num(g(r,'Selling_Price'),0),promo:num(g(r,'Promotion_Flag'),0)>0?1:0,lt:num(g(r,'Lead_Time_Days'),5)});
  }
  const series=[];
  for(const [k,v] of groups){
    v.rows.sort((a,b)=>a.date&&b.date?a.date-b.date:(a.wk<b.wk?-1:a.wk>b.wk?1:0));
    if(v.rows.length<30)continue;
    v.rows.forEach((x,i)=>{x.w=i;x.week=x.date?isoWeekLabel(x.date):x.wk;x.ram=ramadanFlag(x.date)});
    series.push({key:k,pid:v.pid,loc:v.loc,name:v.name,cat:v.cat,sup:v.sup,moq:1,rows:v.rows});
  }
  if(!series.length)throw new Error('No product-location series with at least 30 weekly rows were found.');
  const minN=Math.min(...series.map(s=>s.rows.length));
  series.forEach(s=>{s.rows=s.rows.slice(-minN);s.rows.forEach((x,i)=>x.w=i)});
  if(!idx('Promotion_Flag')<0)notes.add('Promotion_Flag not provided: treated as 0.');
  if(idx('Promotion_Flag')<0)notes.add('Promotion_Flag not provided: treated as 0.');
  if(idx('Selling_Price')<0)notes.add('Selling_Price not provided: Price_Change feature is 0.');
  return {series,notes:[...notes],dropped:groups.size-series.length};
}

function chart(o){

  const X=i=>L+i*(W-L-R)/Math.max(1,n-1);

  const Y=v=>T+(H-T-B)*(1-v/ymax);
  let s=`<svg class="chart" id="${o.id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'chart')}">`;
  for(let k=0;k<=4;k++){const v=ymax*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  (o.bands||[]).forEach(b=>{s+=`<rect x="${X(b.i0)}" y="${T}" width="${Math.max(0,X(b.i1)-X(b.i0))}" height="${H-T-B}" fill="${b.color}" opacity="${b.op||.07}"/><text x="${X(b.i0)+6}" y="${T+11}" fill="${b.color}" style="fill:${b.color};font-weight:600">${b.label}</text>`});
  const step=Math.ceil(n/8);
  o.xs.forEach((x,i)=>{if(i%step===0||i===n-1&&n-1-(Math.floor((n-1)/step)*step)>step/2)s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${x}</text>`});
  o.lines.forEach(l=>{
    let d='',started=false;l.vals.forEach((v,i)=>{if(v==null){started=false;return}d+=(started?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);started=true});

    s+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.w||2}" ${l.dash?`stroke-dasharray="${l.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
    (l.dots||[]).forEach(i=>{if(l.vals[i]!=null)s+=`<circle cx="${X(i)}" cy="${Y(l.vals[i])}" r="${l.dotR||5}" fill="${l.dotFill||l.color}" stroke="var(--surface)" stroke-width="2"/>`});
  });
  (o.markers||[]).forEach(m=>{s+=`<circle cx="${X(m.i)}" cy="${Y(m.y)}" r="3.5" fill="${m.color}" stroke="var(--surface)" stroke-width="1"/>`});
  s+=`<line id="${o.id}-x" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/></svg>`;
  charts[o.id]={xs:o.xs,lines:o.lines,L,R,W,n,tipExtra:o.tipExtra};
  const lg=o.lines.filter(l=>l.name).map(l=>`<span><i style="background:${l.color};${l.dash?'height:0;border-top:2px dashed '+l.color+';background:none':''}"></i>${l.name}</span>`).join('')+(o.legendExtra||'');
  return `<div class="chart-wrap">${s}</div><div class="legend">${lg}</div>`;
}

function setOv(key,f,v){state.ov[key]=Object.assign({},state.ov[key]);state.ov[key][f]=v}
function approve(key,qty){state.decisions[key]={status:'approved',qty:Math.max(0,Math.round(qty))};toast('Order approved')}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='nav'){state.view=b.dataset.v;render();window.scrollTo(0,0)}
  else if(a==='open'){state.sel=b.dataset.key;state.view='workbench';state.stage=1;render();window.scrollTo(0,0)}
  else if(a==='stage'){state.stage=+b.dataset.i;render()}
  else if(a==='statusf'){state.filt.status=b.dataset.v;render()}
  else if(a==='approve'){const r=state.byKey[b.dataset.key];const inp=b.dataset.from==='qty'?+$('#dec-qty').value:r.qty;approve(b.dataset.key,inp);render()}
  else if(a==='defer'){state.decisions[b.dataset.key]={status:'deferred',qty:0};toast('Order deferred');render()}
  else if(a==='undec'){delete state.decisions[b.dataset.key];render()}
  else if(a==='approveall'){let c=0;state.res.forEach(r=>{if((r.status==='Urgent'||r.status==='Reorder')&&r.qty>0&&!state.decisions[r.key]){state.decisions[r.key]={status:'approved',qty:r.qty};c++}});toast(c+' orders approved');render()}
  else if(a==='exportq'){const q=state.res.filter(r=>state.decisions[r.key]&&state.decisions[r.key].status==='approved');
    const h='Product_ID,Product,Location_ID,Supplier_ID,Forecast_Qty,Inventory_Position,Safety_Stock,Reorder_Point,Recommended_Qty,Approved_Qty\n';
    exportText('order_queue.csv',h+q.map(r=>[r.s.pid,'"'+r.s.name.replace(/"/g,'""')+'"',r.s.loc,r.s.sup,Math.round(r.F),Math.round(r.IP),Math.round(r.SS),Math.round(r.ROP),r.qty,state.decisions[r.key].qty].join(',')).join('\n'))}
  else if(a==='resetov'){delete state.ov[state.sel];compute(false);render()}
  else if(a==='src'){state.source=b.dataset.v;compute(false);render()}
  else if(a==='resetpol'){state.policy=Object.assign({},DEFAULT_POLICY,{urgentPct:65});compute(true);render()}
  else if(a==='template'){const s=state.series[0];const h='Week,Product_ID,Product_Name,Product_Category,Location_ID,Supplier_ID,Sales_Qty,Closing_Inventory,Incoming_Inventory,Backorder_Qty,Stockout_Flag,Selling_Price,Promotion_Flag,Lead_Time_Days\n';
    exportText('demand_panel_template.csv',h+s.rows.slice(-6).map(x=>[x.date?x.date.toISOString().slice(0,10):x.week,s.pid,'"'+s.name+'"',s.cat,s.loc,s.sup,x.sales,x.closing,x.incoming,x.backorder,x.so,x.price,x.promo,x.lt].join(',')).join('\n')+'\n# Replace these sample rows with at least 30 weeks per Product_ID and Location_ID, then delete this line.')}
  else if(a==='resetdata'){loadSeries(generateSyntheticData(20260928),{kind:'synthetic',label:'Synthetic demonstration data',notes:[]});toast('Synthetic demo data restored')}

});
document.addEventListener('change',e=>{
  const t=e.target;const a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='floc'){state.filt.loc=t.value;render()}else if(a==='fcat'){state.filt.cat=t.value;render()}
  else if(a==='selprod'||a==='selloc'){const cur=state.byKey[state.sel].s;const pid=a==='selprod'?t.value:cur.pid;const loc=a==='selloc'?t.value:cur.loc;
    const k=pid+'|'+loc;if(state.byKey[k])state.sel=k;else{const alt=state.series.find(x=>x.pid===pid);if(alt)state.sel=alt.key}render()}
  else if(a==='ov'){const f=t.dataset.f;let v=t.type==='checkbox'?t.checked:parseFloat(t.value);if(t.type!=='checkbox'&&isNaN(v))v=0;setOv(state.sel,f,v);compute(false);render()}
  else if(a==='pol'){const f=t.dataset.f;if(t.type==='checkbox')state.policy[f]=t.checked;else if(f==='service')state.policy.service=t.value;else state.policy[f]=parseFloat(t.value)||state.policy[f];compute(f==='excludeCensored');render()}
  else if(a==='impfc'||a==='impdata'){const file=t.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{a==='impfc'?importForecasts(rd.result):importDataset(rd.result,file.name)}catch(err){toast(err.message)}};rd.readAsText(file);t.value=''}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.act==='fq'){state.filt.q=t.value;const pos=t.selectionStart;render();const i=document.querySelector('[data-act="fq"]');if(i){i.focus();i.setSelectionRange(pos,pos)}}
  if(t.dataset&&t.dataset.act==='ov'&&t.type==='range'){const el=document.querySelector('[data-adjv]');if(el)el.textContent=(t.value>0?'+':'')+t.value+'%'}});
function importForecasts(text){
  const t=parseCSV(text);const h=t[0].map(normKey);const ip=h.indexOf('productid'),il=h.indexOf('locationid'),iq=h.indexOf('forecastqty'),im=h.indexOf('modelname');
  if(ip<0||il<0||iq<0)throw new Error('Forecast CSV needs Product_ID, Location_ID and Forecast_Qty columns.');
  const map=new Map();let un=0,model='';
  for(const r of t.slice(1)){const k=r[ip].trim()+'|'+r[il].trim();const v=parseFloat(r[iq]);if(!state.series.some(s=>s.key===k)||isNaN(v)){un++;continue}map.set(k,Math.max(0,v));if(im>=0&&r[im])model=r[im].trim()}
  if(!map.size)throw new Error('No rows matched the dashboard\'s product-location series.');
  state.imported=map;state.importedInfo={matched:map.size,unmatched:un,model};state.source='imported';compute(false);render();toast(`Imported ${map.size} forecasts`);
}
function loadSeries(series,meta){
  state.series=series;state.data=meta;state.ov={};state.decisions={};state.imported=null;state.importedInfo=null;state.source='baseline';state.sel=null;state.filt={loc:'all',cat:'all',q:'',status:'all'};
  compute(true);render();
}
function importDataset(text,name){
  const r=seriesFromCSV(text);
  loadSeries(r.series,{kind:'upload',label:'Your uploaded dataset ('+name+')',notes:r.notes.concat(r.dropped?[r.dropped+' series with fewer than 30 weeks were skipped.']:[])});
  state.view='data';render();toast('Dataset loaded: '+r.series.length+' series');
}
